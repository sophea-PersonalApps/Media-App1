name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore GalleryActivity baseline
        run: git checkout 41905f1 -- app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt

      - name: Apply pinch zoom and gallery pan implementation
        run: |
          set -euo pipefail
          python3 tools/patch_pinch_zoom.py

      - name: Apply gallery video actions and album navigation
        run: |
          set -euo pipefail
          python3 tools/patch_gallery_ui.py

      - name: Apply gallery editor crop
        run: |
          set -euo pipefail
          python3 tools/patch_gallery_editor_crop.py

      - name: Apply requested gallery and scanner changes
        run: |
          set -euo pipefail
          python3 tools/patch_requested_ui.py

      - name: Apply final gallery pager and scanner layout
        run: |
          set -euo pipefail
          python3 tools/fix_gallery_scanner_layout.py

      - name: Apply final gallery gesture fix
        run: |
          set -euo pipefail
          python3 tools/fix_gallery_gestures.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify generated source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt").read_text(encoding="utf-8")
          gallery = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt").read_text(encoding="utf-8")
          editor = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryEditorActivity.kt").read_text(encoding="utf-8")
          scanner = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt").read_text(encoding="utf-8")
          qr = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/QrScannerActivity.kt").read_text(encoding="utf-8")
          cap_start = scanner.find("@Composable\nprivate fun ScannerCapture(")
          cap_end = scanner.find("\n@Composable", cap_start + 1)
          if cap_start < 0 or cap_end < 0:
              raise SystemExit("SOURCE AUDIT FAILED: ScannerCapture boundary not found")
          cap = scanner[cap_start:cap_end]
          checks = {
              "camera pinch": "detectTransformGestures(panZoomLock = true)" in main and "var gestureZoom = cameraZoom" in main,
              "gallery stable viewer": ".pointerInput(uri, currentIndex)" in gallery and "detectTransformGestures" in gallery and "val focalX = centroid.x - viewportWidth / 2f" in gallery,
              "gallery no swipe pager": "AdjacentMedia(" not in gallery and "swipeOffset" not in gallery and "videoNavigationStarted" not in gallery,
              "gallery zoom pan": "mediaPanX" in gallery and "mediaPanY" in gallery and "mediaZoom" in gallery,
              "gallery video speed": "VideoPlayer(uri, videoSpeed)" in gallery,
              "gallery smooth pinch": "coerceIn(0.5f, 2f)" in gallery,
              "gallery required imports": "import androidx.compose.animation.core.Animatable" in gallery and "import androidx.compose.ui.zIndex" in gallery and "import kotlinx.coroutines.launch" in gallery,
              "gallery full-image cache": "fun getFull(uri: Uri)" in gallery and "fun putFull(uri: Uri, bitmap: Bitmap)" in gallery and "ThumbnailMemoryCache.get(uri, false)" in gallery,
              "gallery editor crop mode": "var cropMode by remember" in editor and 'Text(if (cropMode) "Done Crop" else "Crop")' in editor,
              "gallery editor visible crop": "CropOverlay(" in editor and "drawRect(Color.White" in editor and "handleLeft" in editor and "handleRight" in editor and "handleTop" in editor and "handleBottom" in editor,
              "gallery editor crop processing": "Bitmap.createBitmap(output, left, top" in editor,
              "scanner shared chrome": "mode = CameraSectionMode.SCAN" in cap and "CameraSectionBottomNavigation(" in cap and "onPrimaryAction = onCapture" in cap,
              "scanner PAGES action": "onFlip = onFinish" in cap and "scannerPageCount = pages.size" in cap,
              "scanner old control stack removed": 'Text("Finish")' not in cap and "LazyRow(" not in cap and 'Text("MORE"' not in cap,
              "scanner header removed": 'Text("Scanner", color = ComposeColor.White' not in cap and 'IconButton(onClick = onBack)' not in cap,
              "qr header removed": 'Text("QR SCANNER", color = Color.White' not in qr,
              "main forward animation": "R.anim.slide_in_right" in main and "R.anim.slide_out_left" in main,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(("PASS " if ok else "FAIL ") + name)
          if failed: raise SystemExit("SOURCE AUDIT FAILED: " + "; ".join(failed))
          print("ALL GENERATED SOURCE AUDITS PASSED")
          PY

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists and is a real APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(file -b --mime-type "$APK")" = "application/vnd.android.package-archive"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaToolbox-debug-apk-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Persist generated implementation on test branch
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryEditorActivity.kt app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt app/src/main/java/com/devlinguistpro/mediatoolbox/QrScannerActivity.kt app/src/main/res/anim/slide_in_right.xml app/src/main/res/anim/slide_out_left.xml app/src/main/res/anim/slide_in_left.xml app/src/main/res/anim/slide_out_right.xml
          if git diff --cached --quiet; then
            echo 'No generated source changes to persist.'
          else
            git commit -m 'Persist final gallery fixes [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
