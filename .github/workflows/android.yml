name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, gallery-fix ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Validate scanner source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt").read_text(encoding="utf-8")
          required = [
              "private fun decodePreview(path: String): Bitmap?",
              "CameraSectionControls(",
              "CameraSectionBottomNavigation(",
              "startActivity(Intent(this, MainActivity::class.java)",
              "startActivity(Intent(this, GalleryActivity::class.java))",
              "startActivity(Intent(this, QrScannerActivity::class.java))",
          ]
          missing = [item for item in required if item not in text]
          forbidden = ["onOpenCamera = ::openCamera", "onOpenGallery = ::openGallery", "onOpenQr = ::openQr"]
          present_forbidden = [item for item in forbidden if item in text]
          if missing: raise SystemExit("Scanner source is incomplete; missing: " + repr(missing))
          if present_forbidden: raise SystemExit("Scanner source contains unresolved navigation callbacks: " + repr(present_forbidden))
          PY

      - name: Verify camera source wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "currentLens: Int,", "mode: CameraSectionMode", "CameraSectionControls(",
              "CameraSectionBottomNavigation(", "CameraSectionMode.SCAN", "CameraSectionMode.QR",
              "scaleType = if (currentLens == CameraSelector.LENS_FACING_FRONT)",
          ]
          missing = [item for item in required if item not in text]
          if missing: raise SystemExit("Camera source wiring is incomplete; missing: " + repr(missing))
          PY

      - name: Apply build-safe source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          camera = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt")
          text = camera.read_text(encoding="utf-8")
          text = text.replace("onZoom = ::setCameraZoom", "onZoom = ::updateCameraZoom")
          text = text.replace("private fun setCameraZoom(value: Float)", "private fun updateCameraZoom(value: Float)")
          if "private fun updateCameraZoom(value: Float)" not in text:
              raise SystemExit("Camera zoom function fix was not applied")
          camera.write_text(text, encoding="utf-8")

          gallery = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt")
          text = gallery.read_text(encoding="utf-8")
          if "import androidx.compose.ui.input.pointer.pointerInput" not in text:
              text = text.replace("import androidx.compose.ui.graphics.graphicsLayer\n", "import androidx.compose.ui.graphics.graphicsLayer\nimport androidx.compose.foundation.pager.HorizontalPager\nimport androidx.compose.foundation.pager.rememberPagerState\nimport androidx.compose.ui.input.pointer.pointerInput\nimport com.davemorrissey.labs.subscaleview.ImageSource\nimport com.davemorrissey.labs.subscaleview.SubsamplingScaleImageView\n")

          # MediaGrid uses Modifier.weight(1f), so give it a ColumnScope receiver.
          text = text.replace("@Composable\nprivate fun MediaGrid(", "@Composable\nprivate fun ColumnScope.MediaGrid(")

          start = text.index("@Composable private fun MediaViewer(")
          end = text.index("private enum class VideoLoadState", start)
          replacement = r'''@Composable private fun MediaViewer(items: List<MediaItem>, initialUri: Uri, onBack: () -> Unit, onShare: (MediaItem) -> Unit, onEdit: (MediaItem) -> Unit, onDelete: (MediaItem) -> Unit) {
    val safeItems = remember(items) { items.toList() }
    val initialPage = remember(initialUri, safeItems) { safeItems.indexOfFirst { it.uri == initialUri }.coerceAtLeast(0) }
    val pagerState = rememberPagerState(initialPage = initialPage, pageCount = { safeItems.size.coerceAtLeast(1) })
    val currentIndex = pagerState.currentPage.coerceIn(0, (safeItems.size - 1).coerceAtLeast(0))
    val currentItem = safeItems.getOrNull(currentIndex)
    var confirmDelete by rememberSaveable { mutableStateOf(false) }
    BackHandler(onBack = onBack)
    Surface(Modifier.fillMaxSize(), color = Color.Black) {
        Column(Modifier.fillMaxSize()) {
            Row(Modifier.fillMaxWidth().padding(8.dp), verticalAlignment = Alignment.CenterVertically) {
                IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, "Back", tint = Color.White) }
                Spacer(Modifier.width(8.dp))
                currentItem?.let { item ->
                    IconButton(onClick = { onShare(item) }) { Icon(Icons.Default.Share, "Share", tint = Color.White) }
                    if (!item.isVideo) IconButton(onClick = { onEdit(item) }) { Icon(Icons.Default.Edit, "Edit", tint = Color.White) }
                    IconButton(onClick = { confirmDelete = true }) { Icon(Icons.Default.Delete, "Delete", tint = Color.White) }
                }
            }
            if (safeItems.isEmpty()) Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("No media found", color = Color.LightGray) }
            else HorizontalPager(state = pagerState, modifier = Modifier.fillMaxWidth().weight(1f), beyondViewportPageCount = 1, key = { safeItems[it].uri.toString() }) { page ->
                val item = safeItems[page]
                Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { if (item.isVideo) VideoPlayer(item.uri) else ZoomablePhoto(item.uri) }
            }
        }
        if (confirmDelete && currentItem != null) AlertDialog(onDismissRequest = { confirmDelete = false }, title = { Text("Delete media?") }, text = { Text("Delete this \${if (currentItem.isVideo) "video" else "photo"} from your device? This action cannot be undone.") }, confirmButton = { TextButton(onClick = { confirmDelete = false; onDelete(currentItem) }) { Text("Delete") } }, dismissButton = { TextButton(onClick = { confirmDelete = false }) { Text("Cancel") } })
    }
}

@Composable private fun ZoomablePhoto(uri: Uri) {
    val context = LocalContext.current
    AndroidView(modifier = Modifier.fillMaxSize(), factory = {
        SubsamplingScaleImageView(context).apply {
            setMinimumScaleType(SubsamplingScaleImageView.SCALE_TYPE_CENTER_INSIDE)
            setPanEnabled(true)
            setZoomEnabled(true)
            setDoubleTapZoomDuration(200)
            tag = uri.toString()
            setImage(ImageSource.uri(uri.toString()))
        }
    }, update = { view -> if (view.tag != uri.toString()) { view.tag = uri.toString(); view.resetScaleAndCenter(); view.setImage(ImageSource.uri(uri.toString())) } })
}

@Composable private fun VideoPlayer(uri: Uri) {
    val context = LocalContext.current
    var state by remember(uri) { mutableStateOf(VideoLoadState.LOADING) }
    var retryKey by remember(uri) { mutableIntStateOf(0) }
    var speed by remember(uri) { mutableFloatStateOf(1f) }
    var speedMenuOpen by remember(uri) { mutableStateOf(false) }
    var activePlayer by remember(uri) { mutableStateOf<MediaPlayer?>(null) }
    var videoZoom by rememberSaveable(uri) { mutableFloatStateOf(1f) }
    var videoOffsetX by rememberSaveable(uri) { mutableFloatStateOf(0f) }
    var videoOffsetY by rememberSaveable(uri) { mutableFloatStateOf(0f) }
    var dragX by rememberSaveable(uri) { mutableFloatStateOf(0f) }
    var dragY by rememberSaveable(uri) { mutableFloatStateOf(0f) }
    val videoView = remember(uri) { VideoView(context).apply { layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT); isFocusable = true; isFocusableInTouchMode = true; setMediaController(MediaController(context).also { it.setAnchorView(this) }) } }
    val scaleDetector = remember(videoView) { android.view.ScaleGestureDetector(context, object : android.view.ScaleGestureDetector.SimpleOnScaleGestureListener() { override fun onScale(detector: android.view.ScaleGestureDetector): Boolean { videoZoom = (videoZoom * detector.scaleFactor).coerceIn(1f, 5f); if (videoZoom <= 1.001f) { videoOffsetX = 0f; videoOffsetY = 0f }; videoView.scaleX = videoZoom; videoView.scaleY = videoZoom; videoView.translationX = videoOffsetX; videoView.translationY = videoOffsetY; return true } }) }
    DisposableEffect(videoView, scaleDetector) { videoView.setOnTouchListener { _, event -> if (event.pointerCount >= 2 || scaleDetector.isInProgress) scaleDetector.onTouchEvent(event); if (videoZoom > 1.001f && event.pointerCount == 1) when (event.actionMasked) { MotionEvent.ACTION_DOWN -> { dragX = event.x; dragY = event.y }; MotionEvent.ACTION_MOVE -> { videoOffsetX += event.x - dragX; videoOffsetY += event.y - dragY; dragX = event.x; dragY = event.y; videoView.translationX = videoOffsetX; videoView.translationY = videoOffsetY } }; false }; onDispose { videoView.setOnTouchListener(null); activePlayer = null; runCatching { videoView.stopPlayback() } } }
    LaunchedEffect(uri, retryKey) { state = VideoLoadState.LOADING; activePlayer = null; videoView.setOnPreparedListener { player -> activePlayer = player; player.isLooping = false; if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) player.playbackParams = player.playbackParams.apply { this.speed = speed }; state = VideoLoadState.READY; videoView.requestFocus(); player.start() }; videoView.setOnCompletionListener { state = VideoLoadState.COMPLETED }; videoView.setOnErrorListener { _, _, _ -> activePlayer = null; state = VideoLoadState.ERROR; true }; videoView.setVideoURI(uri); videoView.requestFocus() }
    Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
        AndroidView(modifier = Modifier.fillMaxSize(), factory = { videoView })
        when (state) { VideoLoadState.LOADING -> CircularProgressIndicator(color = Color.White); VideoLoadState.ERROR -> Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.padding(24.dp)) { Text("Could not play this video", color = Color.White, fontSize = 16.sp); Spacer(Modifier.height(10.dp)); Button(onClick = { retryKey++ }) { Icon(Icons.Default.Refresh, "Retry"); Spacer(Modifier.size(5.dp)); Text("Retry") } }; VideoLoadState.READY, VideoLoadState.COMPLETED -> Unit }
        if (state == VideoLoadState.READY || state == VideoLoadState.COMPLETED) Box(Modifier.align(Alignment.TopEnd).padding(12.dp)) { Button(onClick = { speedMenuOpen = true }) { Text("\${speed}x") }; DropdownMenu(expanded = speedMenuOpen, onDismissRequest = { speedMenuOpen = false }) { listOf(0.5f, 0.75f, 1f, 1.25f, 1.5f, 2f).forEach { selectedSpeed -> DropdownMenuItem(text = { Text("\${selectedSpeed}x") }, onClick = { speed = selectedSpeed; if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) activePlayer?.let { player -> runCatching { player.playbackParams = player.playbackParams.apply { this.speed = selectedSpeed } } }; speedMenuOpen = false }) } } }
    }
}

          '''
          text = text[:start] + replacement + text[end:]
          gallery.write_text(text, encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists and is a real APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(file -b --mime-type "$APK")" = "application/vnd.android.package-archive"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaToolbox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="media-toolbox-debug"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="MediaToolbox-debug.apk"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Media Toolbox Debug APK" --notes "Latest debug APK built from the tested gallery-fix branch." --prerelease
          fi
          gh release upload "$RELEASE_TAG" "$APK#$APK_NAME" --clobber
          echo "DIRECT APK DOWNLOAD: https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_NAME"
