name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Validate scanner source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt").read_text(encoding="utf-8")
          required = [
              "private fun decodePreview(path: String): Bitmap?",
              "CameraSectionControls(",
              "CameraSectionBottomNavigation(",
              "startActivity(Intent(this, MainActivity::class.java)",
              "startActivity(Intent(this, GalleryActivity::class.java))",
              "startActivity(Intent(this, QrScannerActivity::class.java))",
          ]
          missing = [item for item in required if item not in text]
          forbidden = [
              "onOpenCamera = ::openCamera",
              "onOpenGallery = ::openGallery",
              "onOpenQr = ::openQr",
          ]
          present_forbidden = [item for item in forbidden if item in text]
          if missing:
              raise SystemExit("Scanner source is incomplete; missing: " + repr(missing))
          if present_forbidden:
              raise SystemExit("Scanner source contains unresolved navigation callbacks: " + repr(present_forbidden))
          PY

      - name: Verify camera source wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "currentLens: Int,",
              "mode: CameraSectionMode",
              "CameraSectionControls(",
              "CameraSectionBottomNavigation(",
              "CameraSectionMode.SCAN",
              "CameraSectionMode.QR",
              "scaleType = if (currentLens == CameraSelector.LENS_FACING_FRONT)",
          ]
          missing = [item for item in required if item not in text]
          if missing: raise SystemExit("Camera source wiring is incomplete; missing: " + repr(missing))
          PY

      - name: Apply build-safe source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          camera = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt")
          text = camera.read_text(encoding="utf-8")
          text = text.replace("onZoom = ::setCameraZoom", "onZoom = ::updateCameraZoom")
          text = text.replace("private fun setCameraZoom(value: Float)", "private fun updateCameraZoom(value: Float)")
          if "private fun updateCameraZoom(value: Float)" not in text:
              raise SystemExit("Camera zoom function fix was not applied")
          camera.write_text(text, encoding="utf-8")

          gallery = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt")
          gallery_text = gallery.read_text(encoding="utf-8")
          if "import androidx.compose.ui.input.pointer.pointerInput" not in gallery_text:
              gallery_text = gallery_text.replace(
                  "import androidx.compose.ui.graphics.graphicsLayer\n",
                  "import androidx.compose.ui.graphics.graphicsLayer\nimport androidx.compose.ui.input.pointer.pointerInput\n"
              )
          if "import androidx.compose.foundation.layout.weight" not in gallery_text:
              gallery_text = gallery_text.replace(
                  "import androidx.compose.foundation.layout.*\n",
                  "import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.layout.weight\n"
              )
          gallery.write_text(gallery_text, encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists and is a real APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(file -b --mime-type "$APK")" = "application/vnd.android.package-archive"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaToolbox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="media-toolbox-debug"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="MediaToolbox-debug.apk"

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Media Toolbox Debug APK" \
              --notes "Latest debug APK built from main." \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" "$APK#$APK_NAME" --clobber

          echo ""
          echo "============================================================"
          echo "DIRECT APK DOWNLOAD"
          echo "https://github.com/devLinguistPro/media-toolbox/releases/download/$RELEASE_TAG/$APK_NAME"
          echo "============================================================"
