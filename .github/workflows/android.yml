name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Validate scanner source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt").read_text(encoding="utf-8")
          required = [
              "private fun decodePreview(path: String): Bitmap?",
              "CameraSectionControls(",
              "CameraSectionBottomNavigation(",
              "startActivity(Intent(this, MainActivity::class.java)",
              "startActivity(Intent(this, GalleryActivity::class.java))",
              "startActivity(Intent(this, QrScannerActivity::class.java))",
          ]
          missing = [item for item in required if item not in text]
          forbidden = [
              "onOpenCamera = ::openCamera",
              "onOpenGallery = ::openGallery",
              "onOpenQr = ::openQr",
          ]
          present_forbidden = [item for item in forbidden if item in text]
          if missing:
              raise SystemExit("Scanner source is incomplete; missing: " + repr(missing))
          if present_forbidden:
              raise SystemExit("Scanner source contains unresolved navigation callbacks: " + repr(present_forbidden))
          PY

      - name: Verify camera source wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "currentLens: Int,",
              "mode: CameraSectionMode",
              "CameraSectionControls(",
              "CameraSectionBottomNavigation(",
              "CameraSectionMode.SCAN",
              "CameraSectionMode.QR",
              "scaleType = if (currentLens == CameraSelector.LENS_FACING_FRONT)",
          ]
          missing = [item for item in required if item not in text]
          if missing: raise SystemExit("Camera source wiring is incomplete; missing: " + repr(missing))
          PY

      - name: Apply reliable zoom source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt")
          text = main.read_text(encoding="utf-8")

          text = text.replace("onZoom = ::setCameraZoom", "onZoom = ::updateCameraZoom")
          text = text.replace("private fun setCameraZoom(value: Float)", "private fun updateCameraZoom(value: Float)")

          old_gesture = '''        Box(Modifier.fillMaxWidth().fillMaxHeight(0.72f).align(Alignment.TopCenter).pointerInput(mode) {
            var drag = 0f
            detectHorizontalDragGestures(onHorizontalDrag = { _, amount -> drag += amount }, onDragEnd = {
                when { drag < -80f && selectedIndex < modes.lastIndex -> onModeChanged(modes[selectedIndex + 1]); drag > 80f && selectedIndex > 0 -> onModeChanged(modes[selectedIndex - 1]) }
                drag = 0f
            })
        })
        if (mode == CameraSectionMode.PHOTO || mode == CameraSectionMode.VIDEO) {
            Box(Modifier.fillMaxWidth().fillMaxHeight(0.72f).align(Alignment.TopCenter).pointerInput(mode, currentLens) {
                detectTransformGestures { _, _, zoom, _ -> onZoom(cameraZoom * zoom) }
            })
        }
'''
          new_gesture = '''        if (mode == CameraSectionMode.PHOTO || mode == CameraSectionMode.VIDEO) {
            Box(Modifier.fillMaxWidth().fillMaxHeight(0.72f).align(Alignment.TopCenter).pointerInput(mode, currentLens, cameraZoom) {
                detectTransformGestures { _, pan, zoom, _ ->
                    if (zoom != 1f) {
                        onZoom(cameraZoom * zoom)
                    } else if (cameraZoom <= 1.001f && kotlin.math.abs(pan.x) > 55f && kotlin.math.abs(pan.x) > kotlin.math.abs(pan.y) * 1.25f) {
                        when {
                            pan.x < 0f && selectedIndex < modes.lastIndex -> onModeChanged(modes[selectedIndex + 1])
                            pan.x > 0f && selectedIndex > 0 -> onModeChanged(modes[selectedIndex - 1])
                        }
                    }
                }
            })
        } else {
            Box(Modifier.fillMaxWidth().fillMaxHeight(0.72f).align(Alignment.TopCenter).pointerInput(mode) {
                detectHorizontalDragGestures(onHorizontalDrag = { _, _ -> }, onDragEnd = {})
            })
        }
'''
          if old_gesture in text:
              text = text.replace(old_gesture, new_gesture)
          elif "detectTransformGestures { _, pan, zoom, _ ->" not in text:
              raise SystemExit("Camera gesture block was not found")
          main.write_text(text, encoding="utf-8")

          gallery = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt")
          g = gallery.read_text(encoding="utf-8")
          import_anchor = "import androidx.compose.ui.graphics.graphicsLayer\n"
          if "import androidx.compose.ui.input.pointer.pointerInput\n" not in g:
              if import_anchor not in g:
                  raise SystemExit("Gallery import anchor was not found")
              g = g.replace(import_anchor, import_anchor + "import androidx.compose.ui.input.pointer.pointerInput\n", 1)
          g = g.replace("@Composable private fun MediaGrid(items: List<MediaItem>", "@Composable private fun ColumnScope.MediaGrid(items: List<MediaItem>", 1)
          gallery.write_text(g, encoding="utf-8")

          video = gallery.read_text(encoding="utf-8")
          old_video_touch = "        videoView.setOnTouchListener { _, event -> scaleDetector.onTouchEvent(event); false }"
          new_video_touch = '''        videoView.setOnTouchListener { _, event ->
            val wasScaling = scaleDetector.isInProgress
            scaleDetector.onTouchEvent(event)
            event.pointerCount >= 2 || wasScaling || scaleDetector.isInProgress
        }'''
          if old_video_touch in video:
              video = video.replace(old_video_touch, new_video_touch, 1)
          else:
              raise SystemExit("Gallery video touch listener was not found")
          gallery.write_text(video, encoding="utf-8")
          PY

      - name: Verify zoom source fixes were applied
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt").read_text(encoding="utf-8")
          gallery = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt").read_text(encoding="utf-8")
          required_main = ["detectTransformGestures { _, pan, zoom, _ ->", "onZoom = ::updateCameraZoom"]
          required_gallery = ["import androidx.compose.ui.input.pointer.pointerInput", "ColumnScope.MediaGrid", "scaleDetector.isInProgress"]
          for item in required_main:
              if item not in main: raise SystemExit("Missing camera fix: " + item)
          for item in required_gallery:
              if item not in gallery: raise SystemExit("Missing gallery/video fix: " + item)
          PY

      - name: Build Android Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists and is a real APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(file -b --mime-type "$APK")" = "application/vnd.android.package-archive"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaToolbox-debug-apk-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Commit tested source fixes back to branch
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Fix pinch zoom gestures"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="media-toolbox-debug"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="MediaToolbox-debug.apk"

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Media Toolbox Debug APK" \
              --notes "Latest debug APK built from main." \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" "$APK#$APK_NAME" --clobber

          echo ""
          echo "============================================================"
          echo "DIRECT APK DOWNLOAD"
          echo "https://github.com/sophea-PersonalApps/Media-App1/releases/download/$RELEASE_TAG/$APK_NAME"
          echo "============================================================"
