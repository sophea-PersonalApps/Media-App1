name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply safe source fixes
        shell: bash
        run: |
          set -euo pipefail
          GALLERY="app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt"
          MAIN="app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt"
          grep -q 'import androidx.compose.ui.graphics.graphicsLayer' "$GALLERY"
          grep -q '@Composable private fun MediaGrid' "$GALLERY"
          grep -q 'import androidx.compose.ui.input.pointer.pointerInput' "$GALLERY" || sed -i '/import androidx.compose.ui.graphics.graphicsLayer/a import androidx.compose.ui.input.pointer.pointerInput' "$GALLERY"
          sed -i 's/@Composable private fun MediaGrid(/@Composable private fun ColumnScope.MediaGrid(/' "$GALLERY"
          python3 - "$GALLERY" <<'PY'
import sys
from pathlib import Path
p = Path(sys.argv[1])
s = p.read_text()
old = 'videoView.setOnTouchListener { _, event -> scaleDetector.onTouchEvent(event); false }'
new = '''videoView.setOnTouchListener { _, event ->
            val wasScaling = scaleDetector.isInProgress
            scaleDetector.onTouchEvent(event)
            event.pointerCount >= 2 || wasScaling || scaleDetector.isInProgress
        }'''
if old in s:
    s = s.replace(old, new, 1)
elif 'event.pointerCount >= 2 || wasScaling || scaleDetector.isInProgress' not in s:
    raise SystemExit('Expected VideoView touch listener was not found')
p.write_text(s)
PY
          grep -q 'detectTransformGestures' "$MAIN"
          grep -q 'setZoomRatio' "$MAIN"

      - name: Source audit
        shell: bash
        run: |
          set -euo pipefail
          GALLERY="app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt"
          MAIN="app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt"
          grep -q 'import androidx.compose.ui.input.pointer.pointerInput' "$GALLERY"
          grep -q 'ColumnScope.MediaGrid' "$GALLERY"
          grep -q 'detectTransformGestures' "$GALLERY"
          grep -q 'ScaleGestureDetector' "$GALLERY"
          grep -q 'detectTransformGestures' "$MAIN"
          grep -q 'setZoomRatio' "$MAIN"
          echo 'SOURCE AUDIT PASSED'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaToolbox-debug-apk-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Persist source fixes
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$GALLERY" "$MAIN"
          if git diff --cached --quiet; then
            echo 'No source changes to persist.'
          else
            git commit -m 'Fix pinch zoom source issues [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
