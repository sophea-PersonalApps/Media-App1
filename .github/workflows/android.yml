name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'fix/**' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore GalleryActivity before generated patches
        shell: bash
        run: git checkout 41905f1 -- app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt

      - name: Apply pinch zoom and gallery pan implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_pinch_zoom.py

      - name: Apply gallery video actions and album navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_gallery_ui.py

      - name: Apply requested gallery swipe and scanner UI changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_requested_ui.py

      - name: Add gallery swipe gesture import
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/add_gallery_swipe_import.py

      - name: Apply final gallery and scanner layout fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_gallery_scanner_layout.py

      - name: Fix generated scanner layout brace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt")
          text = p.read_text(encoding="utf-8")
          old = 'CameraSectionBottomNavigation(cameraSelected = true, onCamera = onOpenCamera, onGallery = onOpenGallery)\n            }\n        }\n    }\n}'
          new = 'CameraSectionBottomNavigation(cameraSelected = true, onCamera = onOpenCamera, onGallery = onOpenGallery)\n        }\n    }\n}'
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("Removed extra ScannerCapture closing brace.")
          elif new in text:
              print("ScannerCapture brace already fixed.")
          else:
              print("ScannerCapture brace sequence already structurally changed by the latest scanner patch.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify only requested source files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only
          git diff --name-only | grep -E '^(app/src/main/java/com/devlinguistpro/mediatoolbox/(MainActivity|GalleryActivity|ScannerActivity|QrScannerActivity)\.kt|app/src/main/res/anim/(slide_in_right|slide_out_left|slide_in_left|slide_out_right)\.xml|tools/(patch_(pinch_zoom|gallery_ui|requested_ui)|add_gallery_swipe_import|fix_gallery_scanner_layout)\.py|\.github/workflows/android\.yml)$' >/dev/null
          unexpected=$(git diff --name-only | grep -Ev '^(app/src/main/java/com/devlinguistpro/mediatoolbox/(MainActivity|GalleryActivity|ScannerActivity|QrScannerActivity)\.kt|app/src/main/res/anim/(slide_in_right|slide_out_left|slide_in_left|slide_out_right)\.xml|tools/(patch_(pinch_zoom|gallery_ui|requested_ui)|add_gallery_swipe_import|fix_gallery_scanner_layout)\.py|\.github/workflows/android\.yml)$' || true)
          test -z "$unexpected"

      - name: Verify requested source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt").read_text(encoding="utf-8")
          gallery = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt").read_text(encoding="utf-8")
          scanner = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt").read_text(encoding="utf-8")
          qr = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/QrScannerActivity.kt").read_text(encoding="utf-8")
          checks = {
              "camera transform gesture": "detectTransformGestures(panZoomLock = true)" in main,
              "camera accumulated zoom state": "var gestureZoom = cameraZoom" in main,
              "camera accumulated zoom update": "gestureZoom = (gestureZoom * zoom)" in main,
              "camera pointer input is not restarted by zoom state": "pointerInput(mode, currentLens)" in main,
              "old camera horizontal handler removed": "detectHorizontalDragGestures" not in main,
              "old camera zoom multiplication removed": "onZoom(cameraZoom * zoom)" not in main,
              "gallery horizontal pan state": "var photoPanX by rememberSaveable(uri)" in gallery,
              "gallery vertical pan state": "var photoPanY by rememberSaveable(uri)" in gallery,
              "gallery horizontal translation": "translationX =" in gallery,
              "gallery vertical translation": "translationY = photoPanY" in gallery,
              "video speed state": "var videoSpeed by rememberSaveable(uri)" in gallery,
              "video speed top action": "IconButton(onClick = { speedMenuOpen = true }) { Icon(Icons.Default.Speed" in gallery,
              "video speed menu": "DropdownMenu(expanded = speedMenuOpen" in gallery,
              "video player receives speed": "VideoPlayer(uri, videoSpeed)" in gallery,
              "gallery viewer index": "var selectedIndex by rememberSaveable" in gallery and "selectedIndex = media.indexOfFirst" in gallery,
              "gallery viewer navigation": "MediaViewer(selectedUri!!, selectedIsVideo, media, selectedIndex" in gallery,
              "gallery video swipe": "currentIndex < items.lastIndex" in gallery,
              "gallery photo pan preserved": "var photoPanX by rememberSaveable(uri)" in gallery and "translationY = photoPanY" in gallery,
              "gallery swipe import": "import androidx.compose.foundation.gestures.detectHorizontalDragGestures" in gallery,
              "scanner header removed": "Text(\"Scanner\", color = ComposeColor.White" not in scanner,
              "scanner bottom controls": ".align(Alignment.BottomCenter)" in scanner and "ScannerSectionControls:" in scanner and 'Text("MORE"' in scanner and 'Text("PAGES ${pages.size}"' in scanner and "onCapture" in scanner,
              "scanner bottom navigation": "CameraSectionBottomNavigation(" in scanner,
              "QR header removed": "Text(\"QR SCANNER\", color = Color.White" not in qr,
              "scanner and QR forward animations": "R.anim.slide_in_right" in main and "R.anim.slide_in_right" in scanner and "R.anim.slide_in_left" in qr,
              "gallery interactive swipe": "swipeOffset" in gallery and "snapTo" in gallery,
              "gallery adjacent photo": "previousBitmap" in gallery and "nextBitmap" in gallery,
              "gallery continuous swipe animation": "tween(180)" in gallery and "animateTo" in gallery,
              "gallery action row above media": ".zIndex(10f)" in gallery,
              "scanner top-left back removed": "Back to scanner" not in scanner,
              "QR top-left back removed": "Modifier.align(Alignment.TopStart).statusBarsPadding().padding(8.dp)" not in qr,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(("PASS " if ok else "FAIL ") + name)
          if failed: raise SystemExit("REQUESTED SOURCE AUDIT FAILED: " + "; ".join(failed))
          print("ALL REQUESTED SOURCE AUDITS PASSED")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists and is a real APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(file -b --mime-type "$APK")" = "application/vnd.android.package-archive"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaToolbox-debug-apk-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Persist implemented source on test branch
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt app/src/main/java/com/devlinguistpro/mediatoolbox/QrScannerActivity.kt app/src/main/res/anim/slide_in_right.xml app/src/main/res/anim/slide_out_left.xml app/src/main/res/anim/slide_in_left.xml app/src/main/res/anim/slide_out_right.xml
          if git diff --cached --quiet; then
            echo 'No generated source changes to persist.'
          else
            git commit -m 'Implement final gallery and scanner layout fixes [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi