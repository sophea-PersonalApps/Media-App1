name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate scanner source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt").read_text(encoding="utf-8")
          required = [
              "private fun decodePreview(path: String): Bitmap?",
              "CameraSectionControls(",
              "CameraSectionBottomNavigation(",
              "startActivity(Intent(this, MainActivity::class.java)",
              "startActivity(Intent(this, GalleryActivity::class.java))",
              "startActivity(Intent(this, QrScannerActivity::class.java))",
          ]
          missing = [item for item in required if item not in text]
          forbidden = [
              "onOpenCamera = ::openCamera",
              "onOpenGallery = ::openGallery",
              "onOpenQr = ::openQr",
          ]
          present_forbidden = [item for item in forbidden if item in text]
          if missing:
              raise SystemExit("Scanner source is incomplete; missing: " + repr(missing))
          if present_forbidden:
              raise SystemExit("Scanner source contains unresolved navigation callbacks: " + repr(present_forbidden))
          PY

      - name: Verify camera source wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "currentLens: Int,",
              "mode: CameraSectionMode",
              "CameraSectionControls(",
              "CameraSectionBottomNavigation(",
              "CameraSectionMode.SCAN",
              "CameraSectionMode.QR",
              "scaleType = if (currentLens == CameraSelector.LENS_FACING_FRONT)",
          ]
          missing = [item for item in required if item not in text]
          if missing: raise SystemExit("Camera source wiring is incomplete; missing: " + repr(missing))
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: media-toolbox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Save APK outside Actions artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view media-toolbox-debug >/dev/null 2>&1; then
            gh release create media-toolbox-debug \
              --title "Media Toolbox Debug APK" \
              --notes "Latest debug APK built from main." \
              --prerelease
          fi
          gh release upload media-toolbox-debug \
            app/build/outputs/apk/debug/app-debug.apk \
            --clobber
