name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate and normalize scanner source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt")
          text = path.read_text(encoding="utf-8")
          marker = "private fun decodePreview(path: String): Bitmap?"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("ScannerActivity.kt is missing decodePreview()")

          replacement = '''private fun decodePreview(path: String): Bitmap? {
              return try {
                  val file = File(path)
                  val bitmap = BitmapFactory.decodeFile(path) ?: return null
                  val orientation = ExifInterface(file.absolutePath).getAttributeInt(
                      ExifInterface.TAG_ORIENTATION,
                      ExifInterface.ORIENTATION_NORMAL
                  )
                  val matrix = Matrix()
                  when (orientation) {
                      ExifInterface.ORIENTATION_ROTATE_90 -> matrix.postRotate(90f)
                      ExifInterface.ORIENTATION_ROTATE_180 -> matrix.postRotate(180f)
                      ExifInterface.ORIENTATION_ROTATE_270 -> matrix.postRotate(270f)
                      ExifInterface.ORIENTATION_FLIP_HORIZONTAL -> matrix.preScale(-1f, 1f)
                      ExifInterface.ORIENTATION_FLIP_VERTICAL -> matrix.preScale(1f, -1f)
                      else -> return bitmap
                  }
                  Bitmap.createBitmap(
                      bitmap,
                      0,
                      0,
                      bitmap.width,
                      bitmap.height,
                      matrix,
                      true
                  ).also {
                      if (it !== bitmap) bitmap.recycle()
                  }
              } catch (_: Exception) {
                  null
              }
          }
          '''

          normalized = text[:start] + replacement
          path.write_text(normalized, encoding="utf-8")
          PY

          if grep -q 'private fun decodePreview(path: String): Bitmap? = try' app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt; then
            echo "decodePreview() was not normalized"
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: media-toolbox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
