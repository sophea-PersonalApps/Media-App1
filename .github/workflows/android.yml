name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'fix/**' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Apply pinch zoom and gallery pan implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_pinch_zoom.py

      - name: Apply gallery video actions and album navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_gallery_ui.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Validate scanner source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt").read_text(encoding="utf-8")
          required = [
              "private fun decodePreview(path: String): Bitmap?",
              "CameraSectionControls(",
              "CameraSectionBottomNavigation(",
              "startActivity(Intent(this, MainActivity::class.java)",
              "startActivity(Intent(this, GalleryActivity::class.java))",
              "startActivity(Intent(this, QrScannerActivity::class.java))",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit("Scanner source is incomplete; missing: " + repr(missing))
          PY

      - name: Verify all requested gallery source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt").read_text(encoding="utf-8")
          gallery = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt").read_text(encoding="utf-8")
          checks = {
              "camera transform gesture": "detectTransformGestures(panZoomLock = true)" in main,
              "camera accumulated zoom state": "var gestureZoom = cameraZoom" in main,
              "camera accumulated zoom update": "gestureZoom = (gestureZoom * zoom)" in main,
              "camera pointer input is not restarted by zoom state": "pointerInput(mode, currentLens)" in main,
              "old camera horizontal handler removed": "detectHorizontalDragGestures" not in main,
              "old camera zoom multiplication removed": "onZoom(cameraZoom * zoom)" not in main,
              "gallery horizontal pan state": "var photoPanX by rememberSaveable(uri)" in gallery,
              "gallery vertical pan state": "var photoPanY by rememberSaveable(uri)" in gallery,
              "gallery horizontal translation": "translationX = photoPanX" in gallery,
              "gallery vertical translation": "translationY = photoPanY" in gallery,
              "video speed state": "var videoSpeed by rememberSaveable(uri)" in gallery,
              "video speed top action": 'Text("${videoSpeed}x", color = Color.White' in gallery,
              "video player receives speed": "VideoPlayer(uri, videoSpeed)" in gallery,
              "album click is attached to thumbnail": "onClick = { onClick(album) }" in gallery,
              "old floating video speed control removed": "Box(Modifier.align(Alignment.TopEnd).padding(12.dp))" not in gallery,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(("PASS " if ok else "FAIL ") + name)
          if failed: raise SystemExit("GALLERY SOURCE AUDIT FAILED: " + "; ".join(failed))
          print("ALL SOURCE AUDITS PASSED")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists and is a real APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(file -b --mime-type "$APK")" = "application/vnd.android.package-archive"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaToolbox-debug-apk-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Persist implemented source on test branch
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot].com'
          git add app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt
          if git diff --cached --quiet; then
            echo 'No generated source changes to persist.'
          else
            git commit -m 'Add video viewer actions and fix album navigation [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
