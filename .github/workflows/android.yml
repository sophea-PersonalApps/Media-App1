name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate and normalize scanner source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt")
          text = path.read_text(encoding="utf-8")
          if "private fun decodePreview(path: String): Bitmap?" not in text:
              raise SystemExit("ScannerActivity.kt is missing decodePreview()")
          replacements = {
              "onOpenCamera = ::openCamera": "onOpenCamera = { startActivity(Intent(this, MainActivity::class.java)) }",
              "onOpenGallery = ::openGallery": "onOpenGallery = { startActivity(Intent(this, GalleryActivity::class.java)) }",
              "onOpenQr = ::openQr": "onOpenQr = { startActivity(Intent(this, QrScannerActivity::class.java)) }",
          }
          for old, new in replacements.items(): text = text.replace(old, new)
          lines = text.splitlines(keepends=True)
          text = "".join(line for line in lines if "pathEffect = PathEffect.dashPathEffect" not in line)
          path.write_text(text, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt").read_text(encoding="utf-8")
          forbidden = ["onOpenCamera = ::openCamera", "onOpenGallery = ::openGallery", "onOpenQr = ::openQr", "pathEffect = PathEffect.dashPathEffect"]
          remaining = [item for item in forbidden if item in text]
          if remaining: raise SystemExit("Scanner source normalization incomplete: " + repr(remaining))
          PY

      - name: Verify camera source wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt").read_text(encoding="utf-8")
          required = ["currentLens: Int,", "CameraScreen(\n            mode,", "currentLens,\n            onPreviewReady,", "scaleType = if (currentLens == CameraSelector.LENS_FACING_FRONT)"]
          missing = [item for item in required if item not in text]
          if missing: raise SystemExit("Camera source wiring is incomplete; missing: " + repr(missing))
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: media-toolbox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
