name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'fix/**' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The earlier successful build used a clean source baseline followed by
      # deterministic generators. Keep that model, but make the generated
      # sources self-contained so the build does not depend on stale patches.
      - name: Restore GalleryActivity baseline
        shell: bash
        run: git checkout 41905f1 -- app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt

      - name: Apply pinch zoom and gallery pan implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_pinch_zoom.py

      - name: Apply gallery video actions and album navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_gallery_ui.py

      - name: Apply requested gallery and scanner changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_requested_ui.py

      - name: Apply final gallery pager and scanner layout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_gallery_scanner_layout.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify requested source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt").read_text(encoding="utf-8")
          gallery = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt").read_text(encoding="utf-8")
          scanner = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt").read_text(encoding="utf-8")
          qr = Path("app/src/main/java/com/devlinguistpro/mediatoolbox/QrScannerActivity.kt").read_text(encoding="utf-8")
          checks = {
              "camera transform gesture": "detectTransformGestures(panZoomLock = true)" in main,
              "gallery selected index": "var selectedIndex by rememberSaveable" in gallery and "selectedIndex = media.indexOfFirst" in gallery,
              "gallery full pager": "val swipeOffset = remember { Animatable(0f) }" in gallery and "AdjacentMedia(" in gallery and "previousItem" in gallery and "nextItem" in gallery,
              "gallery adjacent drag": "detectHorizontalDragGestures" in gallery and "animateTo(destination, tween(180))" in gallery,
              "gallery zoom pan": "photoPanX" in gallery and "photoPanY" in gallery and "detectTransformGestures" in gallery,
              "video speed": "VideoPlayer(uri, videoSpeed)" in gallery,
              "scanner shared controls": "mode = CameraSectionMode.SCAN" in scanner and "onFlip = onFinish" in scanner and "CameraSectionBottomNavigation(" in scanner,
              "scanner old controls removed": 'Text("Finish")' not in scanner[scanner.find("private fun ScannerCapture("):scanner.find("\n@Composable", scanner.find("private fun ScannerCapture(") + 1)],
              "qr header removed": 'Text("QR SCANNER", color = Color.White' not in qr,
              "forward animation": "R.anim.slide_in_right" in main,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(("PASS " if ok else "FAIL ") + name)
          if failed: raise SystemExit("SOURCE AUDIT FAILED: " + "; ".join(failed))
          print("ALL REQUESTED SOURCE AUDITS PASSED")
          PY

      - name: Verify only expected build changes
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -Ev '^(app/src/main/java/com/devlinguistpro/mediatoolbox/(MainActivity|GalleryActivity|ScannerActivity|QrScannerActivity)\.kt|app/src/main/res/anim/(slide_in_right|slide_out_left|slide_in_left|slide_out_right)\.xml|tools/(patch_(pinch_zoom|gallery_ui|requested_ui)|add_gallery_swipe_import|fix_gallery_scanner_layout|fix_gallery_pager)\.py|app/build.gradle.kts|\.github/workflows/android\.yml)$' || true)
          test -z "$unexpected"

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists and is a real APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(file -b --mime-type "$APK")" = "application/vnd.android.package-archive"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaToolbox-debug-apk-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Persist generated implementation on test branch
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/devlinguistpro/mediatoolbox/MainActivity.kt app/src/main/java/com/devlinguistpro/mediatoolbox/GalleryActivity.kt app/src/main/java/com/devlinguistpro/mediatoolbox/ScannerActivity.kt app/src/main/java/com/devlinguistpro/mediatoolbox/QrScannerActivity.kt app/src/main/res/anim/slide_in_right.xml app/src/main/res/anim/slide_out_left.xml app/src/main/res/anim/slide_in_left.xml app/src/main/res/anim/slide_out_right.xml
          if git diff --cached --quiet; then
            echo 'No generated source changes to persist.'
          else
            git commit -m 'Implement final gallery pager and scanner layout [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
